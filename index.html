<!DOCTYPE html>
<html lang="en" class="h-full" :class="{ 'dark': theme === 'dark' }" :data-theme="theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Chronos - Time Series Manager</title>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.classList.add(theme === 'dark' ? 'wa-dark' : 'wa-light');
            if (theme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <script type="importmap">
    {
      "imports": {
        "date-fns": "https://cdn.jsdelivr.net/npm/date-fns@4.1.0/+esm",
        "dexie": "https://cdn.jsdelivr.net/npm/dexie@latest/+esm",
        "idb": "https://cdn.jsdelivr.net/npm/idb@8/+esm",
        "tabulator": "https://esm.sh/tabulator-tables@6.4.0",
        "papaparse": "https://esm.sh/papaparse@5.5.3"
      }
    }
    </script>

    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.3.1/dist/styles/webawesome.css" /> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.3.1/dist-cdn/styles/themes/default.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.3.1/dist-cdn/styles/utilities.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.3.1/dist-cdn/webawesome.loader.js"></script>

    <script type="module">
      import presetWind from 'https://esm.sh/@unocss/preset-wind'
      // transformers only work with build step
      // import transformerVariantGroup from 'https://esm.sh/@unocss/transformer-variant-group'
      // import transformerDirectives from 'https://esm.sh/@unocss/transformer-directives'

      window.__unocss = {
        presets: [presetWind()],
          theme: {
            breakpoints: {
              xs: '400px',
              sm: '640px',
              md: '768px',
              lg: '1024px',
              xl: '1280px',
              '2xl': '1536px',
            }
          },
        // transformers: [
        //     transformerVariantGroup(),
        //     transformerDirectives(),
        // ],
        variants: [
          { name: 'part',
            match(matcher) {
              const m = matcher.match(/^part-(\w+):/)
              if (!m) return
              return {
                matcher: matcher.slice(m[0].length),
                selector: (s) => `${s}::part(${m[1]})`,
              }
            }
          },
        ],
        shortcuts: [
          ['text-2xs', 'text-[0.625rem]'],
          [/^grid-cols-(\d+)-auto$/, ([, n]) => `grid-cols-[${Array(+n).fill('auto').join('_')}]`],
          [/^masonry(?:-(\w+))+$/, ([full]) => {
            const [, ...bps] = full.split('-')
            return [
                'columns-1',
                ...bps.map((bp, i) => `${bp}:columns-${i+2}`),
                '*:break-inside-avoid'
            ].join(' ')
          }],
        ],
      }

      // Load runtime AFTER config is set
      const script = document.createElement('script')
      script.src = 'https://cdn.jsdelivr.net/npm/@unocss/runtime'
      document.head.appendChild(script)
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-width: 640px) {
            input, select, button { min-height: 44px; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        * { transition: background-color 0.3s ease, border-color 0.3s ease; user-select: none; }        
        wa-tab::part(base){ padding: 1em 1em; }
        wa-tab-panel::part(base){ padding: 0; }

        .expandable ,
        .expandable::part(base) ,
        .expandable::part(body) ,
        .expandable > wa-tab-panel ,
        .expandable > wa-tab-panel::part(base) ,
        .expandable series-chart > div { height: 100%; }
        .expandable > wa-tab { --padding: 1em 1em;}

        wa-number-input::part(start) { display: None;}
        wa-number-input::part(end) { display: None;}
        wa-number-input::part(input) { padding: 0 0;}
        wa-number-input::part(stepper) { max-width: 2rem;}
        .series-name-input::part(base) {
            border-style:none none solid none; border-radius:0;
            font-weight: 600;
            height: 2em;
            /*&:focus-within            */
        }

        .text-normal  { color: var(--wa-color-text-normal); }
        .text-quiet   { color: var(--wa-color-text-quiet); }
        .text-link    { color: var(--wa-color-text-link); }
        .text-brand    { color: var(--wa-color-brand-on-quiet); }
        .surface-raised   { background-color: var(--wa-color-surface-raised); }
        .surface-default  { background-color: var(--wa-color-surface-default); }
        .surface-lowered  { background-color: var(--wa-color-surface-lowered); }

    </style>

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="icon-192.png">

<body class="h-full m-0 font-sans">
    <div id="app" class="h-full"></div>

    <script type="module">
        import { State, Actions } from './mithril-state-actions.js';
        import ListHeader from './list-header.js';
        import DetailHeader from './detail-header.js';
        import Dashboard from './dashboard.js';
        import GroupManager from './group-manager.js';
        import SeriesModal from './series-modal.js';
        import EntryModal from './entry-modal.js';
        import DurationPickerModal from './duration-picker-modal.js';
        import SeriesConfiguration from './seriesConfig.js';
        import SeriesChart from './series-chart.js';
        import Calendar from './calendar.js';
        import SeriesHistory from './series-history.js';
        import { format } from './utils.js';
        import db from './db.js';

        const ChronosApp = {
            oninit: () => {Actions.loadSeries();  window.matchMedia('(min-width: 768px)').addEventListener('change', m.redraw);},
            view: () => {
                return m(".h-full.flex.flex-col", { class: (State.theme === 'dark' ? 'dark' : '') }, [
                    m("header.sticky.top-0.z-30.content-center.px-4.h-16.md:h-10",{style: 'background: var(--wa-color-surface-raised);box-shadow: var(--wa-shadow-s);'}, [
                        State.view === 'list' ? m(ListHeader) : m(DetailHeader)
                    ]),

                    
                    State.view === 'list'
                    ? m([Dashboard,".overflow-y-auto"])
                    : m("wa-tab-group.expandable", {
                        placement: window.matchMedia('(min-width: 768px)').matches ? 'start' : 'top',
                    },
                    [                                    
                    ...[{panel: 'chart', name: 'chart-line'},
                        {panel: 'calendar', name: 'calendar-days'},
                        {panel: 'history', name: 'table-list'},
                        {panel: 'config', name: 'gear'}].map(({panel,name}) =>
                            m("wa-tab[slot=nav]", {panel}, m(icon(name)) )
                        ),

                        m("wa-tab-panel[name=chart]",
                            State.currentSeries ? m(SeriesChart, { seriesId: State.currentSeries.id}) : null
                        ),
                        m("wa-tab-panel[name=calendar]",
                            m(Calendar, {
                                series: State.currentSeries,
                                entries: State.currentSeriesEntries,
                                onDayClick: (dayInfo) => {
                                    const targetDate = new Date(dayInfo.date);
                                    const now = new Date();
                                    targetDate.setHours(now.getHours(), now.getMinutes());
                                    EntryModal.open({series: State.currentSeries, entry: { timestamp: format.dateTime(targetDate), value: 0, notes: '' }});
                                }
                            })
                        ),
                        m("wa-tab-panel[name=history]",
                            m(SeriesHistory, {
                                series: State.currentSeries,
                                entries: State.currentSeriesEntries,
                                onAddEntryClick: () => EntryModal.open({series: State.currentSeries}),
                                onDeleteEntryClick: ({ id }) => Actions.deleteEntry(id),
                                onEntryUpdated: ({ entry }) => Actions.updateEntry(entry)
                            })
                        ),
                        m("wa-tab-panel[name=config]", 
                            m(SeriesConfiguration, {
                                "series-id": State.currentSeries?.id
                            })
                        )
                    ]),

                    m(GroupManager, { onGroupsUpdated: Actions.loadSeries }),

                    m(SeriesModal),

                    m(EntryModal),

                    m(DurationPickerModal),

                    State.toast.show ? m("div", { class: "fixed bottom-5 right-5 z-[100]" }, [
                        m("div", { class: "bg-slate-800 text-white px-6 py-3 rounded-xl shadow-lg flex items-center space-x-3 dark:bg-slate-700" }, [
                            m("span", State.toast.message),
                            m("button", { onclick: () => State.toast.show = false, class: "text-slate-400" }, "×")
                        ])
                    ]) : null

                ]);
            }
        };

        m.mount(document.getElementById('app'), ChronosApp);
    </script>
</body>
</html>
